services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkintel-backend
    # 2. Remove "depends_on: db: condition: service_healthy" since we connect to Supabase
    ports:
      - "8080:8080"
    environment:
      # 3. Paste your Supabase URI here (with sslmode=require)
      DATABASE_URL: ${DATABASE_URL}
      ONNX_MODEL_DIR: /app/models/onnx
      ONNX_RUNTIME_LIB_PATH: /usr/lib/libonnxruntime.so
      PORT: 8080
      GIN_MODE: release
    volumes:
      - ./backend/models/onnx:/app/models/onnx
      - ./ml-python:/app/ml-python

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkintel-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

# 4. Remove the "postgres_data" volume at the bottom if no longer needed